alias: Nightly Natural Candlelight
description: From 9 PM to sunrise, eligible bulbs switched on fade 1% to 80% over 10 seconds, then join Natural
  Candlelight. Optional rooms join only during alternating present weeks. At sunrise, lit eligible bulbs fade
  off over 30 minutes.
mode: queued
max: 10
max_exceeded: silent
triggers:
- trigger: time
  at: '21:00:00'
  id: evening
- trigger: sun
  event: sunrise
  id: sunrise
- trigger: homeassistant
  event: start
  id: startup
- trigger: event
  event_type: state_changed
  id: light_on
- trigger: time_pattern
  minutes: /1
  id: check
conditions:
- condition: template
  value_template: '{{ reason != ''light_on'' or (trigger.event.data.entity_id.startswith(''light.'') and trigger.event.data.new_state
    is not none and trigger.event.data.new_state.state == ''on'' and (trigger.event.data.old_state is none
    or trigger.event.data.old_state.state != ''on'')) }}'
- condition: template
  value_template: '{% set held=states(''input_text.lighting_manual_off'') %}{% set hold_valid=held not in [''*'',''unknown'',''unavailable'']
    and held|length % 8 == 0 %}{% set present=true %}{% if alternating_week_lights|default([])|count>0 %}{%
    set anchor=strptime(alternating_week_start|default(''2026-01-02 16:00:00''),''%Y-%m-%d %H:%M:%S'') %}{%
    set present=((now().replace(tzinfo=None)-anchor).days // 7) % 2 == 0 %}{% endif %}

    {% if reason != ''light_on'' %}{{ true }}{% else %}{% set s=trigger.event.data.new_state %}{% set modes=s.attributes.get(''supported_color_modes'',[])
    or [] %}{{ s.entity_id not in excluded_lights and hold_valid and (s.entity_id|sha256)[:8] not in held and
    (s.entity_id not in (alternating_week_lights|default([])) or present) and modes|reject(''in'',[''onoff'',''unknown''])|list|count>0
    }}{% endif %}'
actions:
- choose:
  - conditions: '{{ reason == ''sunrise'' }}'
    sequence:
    - action: script.turn_on
      target:
        entity_id: script.sunrise_fade_off
      data:
        variables:
          lights: []
          minutes: 30
  default:
  - condition: or
    conditions:
    - condition: time
      after: '21:00:00'
    - condition: sun
      before: sunrise
  - condition: template
    value_template: '{{ not is_state(''script.candlelight_wind_trial'', ''on'') }}'
  - condition: template
    value_template: '{{ not is_state(''script.sunrise_fade_off'', ''on'') }}'
  - condition: template
    value_template: '{{ not is_state(''script.synchronized_color_cycle'',''on'') }}'
  - condition: template
    value_template: '{{ not is_state(''script.custom_lighting_patterns'',''on'') }}'
  - condition: template
    value_template: '{{ not is_state(''script.lighting_off_priority'',''on'') }}'
  - if:
    - condition: template
      value_template: '{{ reason in [''evening'', ''startup''] }}'
    then:
    - action: script.stop_natural_candlelight
    - wait_template: '{{ is_state(''script.natural_candlelight'', ''off'') }}'
      timeout: 00:00:30
      continue_on_timeout: false
  - condition: state
    entity_id: script.natural_candlelight
    state: 'off'
  - action: script.turn_on
    target:
      entity_id: script.natural_candlelight
    data:
      variables:
        lights: []
        only_on: true
        minutes: 0
        preserve_brightness: true
        fade_first_lights: '{% if reason==''light_on'' %}{% set ns=namespace(ids=[]) %}{% for s in states.light
          if s.state==''on'' and as_timestamp(now())-as_timestamp(s.last_changed)<3 %}{% set ns.ids=ns.ids+[s.entity_id]
          %}{% endfor %}{{ ns.ids }}{% else %}{{ [] }}{% endif %}'
variables:
  reason: '{{ trigger.id if trigger is defined else ''manual'' }}'
  excluded_lights: []
  alternating_week_lights: []
  alternating_week_start: '2026-01-02 16:00:00'
