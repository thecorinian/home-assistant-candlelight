alias: Nightly Natural Candlelight
description: From 9 PM until local sunrise, run approved candlelight on lights already on, with automatic recovery
  every minute. At sunrise, fade eligible lit bulbs to off over 30 minutes.
mode: queued
max: 10
max_exceeded: silent
triggers:
- trigger: time
  at: '21:00:00'
  id: evening
- trigger: sun
  event: sunrise
  id: sunrise
- trigger: homeassistant
  event: start
  id: startup
- trigger: event
  event_type: state_changed
  id: light_on
- trigger: time_pattern
  minutes: /1
  id: check
conditions:
- condition: template
  value_template: '{{ reason != ''light_on'' or (trigger.event.data.entity_id.startswith(''light.'') and trigger.event.data.new_state
    is not none and trigger.event.data.new_state.state == ''on'' and (trigger.event.data.old_state is none or trigger.event.data.old_state.state
    != ''on'')) }}'
actions:
- choose:
  - conditions: '{{ reason == ''sunrise'' }}'
    sequence:
    - action: script.turn_on
      target:
        entity_id: script.sunrise_fade_off
      data:
        variables:
          lights: []
          minutes: 30
  default:
  - condition: or
    conditions:
    - condition: time
      after: '21:00:00'
    - condition: sun
      before: sunrise
  - condition: template
    value_template: '{{ not is_state(''script.candlelight_wind_trial'', ''on'') }}'
  - condition: template
    value_template: '{{ not is_state(''script.sunrise_fade_off'', ''on'') }}'
  - if:
    - condition: template
      value_template: '{{ reason in [''evening'', ''startup''] }}'
    then:
    - action: script.stop_natural_candlelight
    - wait_template: '{{ is_state(''script.natural_candlelight'', ''off'') }}'
      timeout: 00:00:30
      continue_on_timeout: false
  - condition: state
    entity_id: script.natural_candlelight
    state: 'off'
  - action: script.turn_on
    target:
      entity_id: script.natural_candlelight
    data:
      variables:
        lights: []
        only_on: true
        minutes: 0
variables:
  reason: '{{ trigger.id if trigger is defined else ''manual'' }}'
