alias: Candlelight Wind Trial
description: 'Timed candle-gust experiment (3 minutes by default): a mix of single deep dips and loose triplets, softened
  recoveries, less time at the brightest baseline, and random 40–100-second calm gaps. Fixed warm white; restores normal
  candlelight afterward.'
icon: mdi:candle
mode: single
fields:
  lights:
    name: Bulbs
    description: Choose the currently-on bulbs to test.
    required: true
    selector:
      entity:
        filter:
          domain: light
        multiple: true
  minutes:
    name: Duration
    description: Trial duration in minutes (1–60). Defaults to 3.
    default: 3
    selector:
      number:
        min: 1
        max: 60
        step: 1
        mode: box
        unit_of_measurement: minutes
variables:
  excluded_lights: []
  pause_helpers: []
  pause_automations: []
  trial_script_entity: script.candlelight_wind_trial
sequence:
- condition: template
  value_template: '{{ is_state(''script.natural_candlelight'', ''on'') and lights | default([], true) | count > 0 }}'
- variables:
    requested: '{{ lights | default([], true) }}'
    run_minutes: '{{ [1, [60, minutes | default(3, true) | int(3)] | min] | max }}'
    only_lit: true
    night_was_on: '{{ is_state(''automation.nightly_natural_candlelight'', ''on'') }}'
    seed: '{{ (range(0, 62832) | random) / 10000 }}'
- variables:
    bulbs: "{% set out = namespace(ids=[]) %}\n{% set source = expand(requested) if requested | count > 0 else states.light\
      \ %}\n{% for s in source %}\n  {% set modes = s.attributes.get('supported_color_modes', []) or [] %}\n  {% if s.domain\
      \ == 'light' and s.state in ['on', 'off'] and s.entity_id not in excluded_lights\n        and modes | reject('in',\
      \ ['onoff', 'unknown']) | list | count > 0\n        and (not only_lit or s.state == 'on') %}\n    {% set out.ids\
      \ = out.ids + [s.entity_id] %}\n  {% endif %}\n{% endfor %}\n{{ out.ids | unique | sort | list }}"
- if:
  - condition: template
    value_template: '{{ bulbs | count == 0 }}'
  then:
  - stop: No available dimmable bulbs were selected.
- if:
  - condition: template
    value_template: '{{ night_was_on }}'
  then:
  - action: automation.turn_off
    target:
      entity_id: automation.nightly_natural_candlelight
    data:
      stop_actions: true
- action: script.stop_natural_candlelight
- wait_template: '{{ is_state(''script.natural_candlelight'', ''off'') }}'
  timeout: 00:00:30
  continue_on_timeout: true
- if:
  - condition: state
    entity_id: script.natural_candlelight
    state: 'on'
  then:
  - action: script.turn_off
    target:
      entity_id: script.natural_candlelight
- variables:
    other_lights: '{{ states.light | map(attribute=''entity_id'') | reject(''in'', bulbs) | list }}'
- if:
  - condition: template
    value_template: '{{ other_lights | count > 0 }}'
  then:
  - action: script.turn_on
    target:
      entity_id: script.natural_candlelight
    data:
      variables:
        lights: '{{ other_lights }}'
        only_on: true
        minutes: 0
- if:
  - condition: template
    value_template: '{{ pause_helpers | count > 0 }}'
  then:
  - action: input_boolean.turn_off
    target:
      entity_id: '{{ pause_helpers }}'
- if:
  - condition: template
    value_template: '{{ pause_automations | count > 0 }}'
  then:
  - action: automation.turn_off
    target:
      entity_id: '{{ pause_automations }}'
    data:
      stop_actions: true
  - action: automation.turn_on
    target:
      entity_id: '{{ pause_automations }}'
- repeat:
    for_each: '{{ bulbs }}'
    sequence:
    - action: light.turn_on
      continue_on_error: true
      target:
        entity_id: '{{ repeat.item }}'
      data: "{% set modes = state_attr(repeat.item, 'supported_color_modes') or [] %} {% if 'color_temp' in modes %}\n\
        \  {% set low = state_attr(repeat.item, 'min_color_temp_kelvin') | int(2000) %}\n  {% set high = state_attr(repeat.item,\
        \ 'max_color_temp_kelvin') | int(6500) %}\n  {{ {'color_temp_kelvin': [low, [2000, high] | min] | max} }}\n{%\
        \ else %}\n  {{ {} }}\n{% endif %}"
- delay:
    milliseconds: 500
- repeat:
    for_each: '{{ bulbs }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ is_state(repeat.item, ''on'') }}'
      then:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: '{{ repeat.item }}'
        data:
          brightness_pct: 70
- variables:
    started: '{{ as_timestamp(now()) }}'
    gust_events: []
    prepared_bulbs: '{{ bulbs }}'
    baseline_from: 70
    baseline_target: 70
    baseline_changed: 0
    baseline_next: '{{ range(30, 181) | random }}'
    baseline_blend_seconds: 20
    last_levels: {}
    last_times: {}
    wind_next: '{{ range(8, 15) | random }}'
- repeat:
    while:
    - condition: template
      value_template: '{{ is_state(trial_script_entity, ''on'') and ((run_minutes | float) == 0 or as_timestamp(now())
        - (started | float) < (run_minutes | float)*60) and expand(bulbs) | selectattr(''state'',''eq'',''on'') | list
        | count > 0 }}'
    sequence:
    - variables:
        bulbs: "{% set out = namespace(ids=[]) %}\n{% set source = expand(requested) if requested | count > 0 else states.light\
          \ %}\n{% for s in source %}\n  {% set modes = s.attributes.get('supported_color_modes', []) or [] %}\n  {%\
          \ if s.domain == 'light' and s.state in ['on', 'off'] and s.entity_id not in excluded_lights\n        and modes\
          \ | reject('in', ['onoff', 'unknown']) | list | count > 0\n        and (not only_lit or s.state == 'on') %}\n\
          \    {% set out.ids = out.ids + [s.entity_id] %}\n  {% endif %}\n{% endfor %}\n{{ out.ids | unique | sort |\
          \ list }}"
    - variables:
        prepared_bulbs: '{{ prepared_bulbs | select(''in'', bulbs) | select(''is_state'', ''on'') | list }}'
    - variables:
        elapsed: '{{ as_timestamp(now()) - (started | float) }}'
    - if:
      - condition: template
        value_template: '{{ (elapsed | float) >= (baseline_next | float) }}'
      then:
      - variables:
          baseline_from: '{{ baseline_target }}'
          baseline_target: '{{ [80, 80, 80, 70, 70, 70, 70, 50, 50, 50] | random }}'
          baseline_changed: '{{ elapsed }}'
          baseline_blend_seconds: '{{ range(15, 31) | random }}'
          baseline_next: '{{ (elapsed | float) + (baseline_blend_seconds | float) + (range(30, 181) | random) }}'
    - if:
      - condition: template
        value_template: '{{ (elapsed | float) >= (wind_next | float) }}'
      then:
      - variables:
          burst_baseline: '{% set age = as_timestamp(now()) - (started | float) - (baseline_changed | float) %}

            {% set u = [0.0, [1.0, age / (baseline_blend_seconds | float)] | min] | max %}

            {% set blend = u*u*(3 - 2*u) %}

            {{ (baseline_from | float) + ((baseline_target | float) - (baseline_from | float))*blend }}'
          pulse_count: '{{ [1, 3] | random }}'
      - variables:
          burst_level: '{{ burst_baseline }}'
      - repeat:
          count: '{{ pulse_count }}'
          sequence:
          - variables:
              dip_level: '{% set fraction = (range(20, 41) | random) if (pulse_count | int) == 1 else (range(25, 61)
                | random) %}

                {{ [20, (burst_baseline | float) * fraction / 100] | max }}'
              recovery_level: "{% if (pulse_count | int) == 1 %}\n  {% set lift = range(-3, 5) | random %}\n{% elif (range(0,\
                \ 5) | random) == 0 %}\n  {% set lift = range(10, 31) | random %}\n{% else %}\n  {% set lift = range(-4,\
                \ 11) | random %}\n{% endif %}\n{{ [20, [100, (burst_baseline | float) + lift] | min] | max }}"
          - repeat:
              for_each: '{% set a = burst_level | float %}{% set d = dip_level | float %}{% set r = recovery_level |
                float %}

                {{ [a+(d-a)/3, a+2*(d-a)/3, d, d+(r-d)/3, d+2*(r-d)/3, r] }}'
              sequence:
              - if:
                - condition: template
                  value_template: '{{ is_state(trial_script_entity, ''on'') and as_timestamp(now()) - (started | float)
                    < (run_minutes | float)*60 and expand(bulbs) | selectattr(''state'', ''eq'', ''on'') | list | count
                    > 0 }}'
                then:
                - action: light.turn_on
                  continue_on_error: true
                  target:
                    entity_id: '{{ expand(bulbs) | selectattr(''state'', ''eq'', ''on'') | map(attribute=''entity_id'')
                      | list }}'
                  data:
                    brightness_pct: '{{ repeat.item | round | int }}'
                - delay:
                    milliseconds: '{{ ([130, 150, 175] if (pulse_count | int) == 1 else [150, 175, 200]) | random }}'
          - variables:
              burst_level: '{{ recovery_level }}'
          - delay:
              milliseconds: '{{ [200, 300, 450, 650] | random }}'
      - variables:
          wind_next: '{{ as_timestamp(now()) - (started | float) + (range(40, 101) | random) }}'
          gust_events: '{% if (pulse_count | int) == 1 %}{{ [] }}{% else %}{{ [[as_timestamp(now()) - (started | float),
            range(30, 51) | random, (range(20, 31) | random)/10, range(0,10000) | random]] }}{% endif %}'
          last_levels: '{% set ns=namespace(items=[]) %}{% for id in bulbs %}{% set ns.items=ns.items+[(id, burst_level
            | float)] %}{% endfor %}{{ dict(ns.items) }}'
          last_times: '{% set ns=namespace(items=[]) %}{% for id in bulbs %}{% set ns.items=ns.items+[(id, as_timestamp(now())
            - (started | float))] %}{% endfor %}{{ dict(ns.items) }}'
    - repeat:
        for_each: '{{ bulbs }}'
        sequence:
        - if:
          - condition: template
            value_template: "{{ is_state(trial_script_entity, 'on')\n   and is_state(repeat.item, 'on')\n   and ((run_minutes\
              \ | float) == 0 or\n        as_timestamp(now()) - (started | float) < (run_minutes | float)*60) }}"
          then:
          - if:
            - condition: template
              value_template: '{{ repeat.item not in prepared_bulbs }}'
            then:
            - action: light.turn_on
              continue_on_error: true
              target:
                entity_id: '{{ repeat.item }}'
              data: "{% set modes = state_attr(repeat.item, 'supported_color_modes') or [] %} {% if 'color_temp' in modes\
                \ %}\n  {% set low = state_attr(repeat.item, 'min_color_temp_kelvin') | int(2000) %}\n  {% set high =\
                \ state_attr(repeat.item, 'max_color_temp_kelvin') | int(6500) %}\n  {{ {'color_temp_kelvin': [low, [2000,\
                \ high] | min] | max} }}\n{% else %}\n  {{ {} }}\n{% endif %}"
            - delay:
                milliseconds: 500
            - variables:
                prepared_bulbs: '{{ prepared_bulbs + [repeat.item] }}'
          - variables:
              baseline: '{% set age = as_timestamp(now()) - (started | float) - (baseline_changed | float) %}

                {% set u = [0.0, [1.0, age / (baseline_blend_seconds | float)] | min] | max %}

                {% set blend = u*u*(3 - 2*u) %}

                {{ (baseline_from | float) + ((baseline_target | float) - (baseline_from | float))*blend }}'
          - variables:
              raw_level: "{% set t = as_timestamp(now()) - (started | float) %} {% set all_ids = states.light | map(attribute='entity_id')\
                \ | sort | list %}\n{% set i = all_ids.index(repeat.item) %} {% set p = (seed | float) + i * 2.39996\
                \ %} {% set envelope = 0.35 + 0.65 * (sin(0.17*t + (seed | float)) ** 2) %} {% set turbulence = envelope\
                \ * (3.6*sin(0.61*t+p) + 2.4*sin(1.13*t+1.9*p) + 1.6*sin(1.97*t+0.7*p) + 0.8*sin(2.3*t+2.4*p)) %} {%\
                \ set wander = 4*sin(0.075*t+p) + 2*sin(0.19*t+1.7*p) %} {% set response = namespace(value=0.0) %} {%\
                \ for event in gust_events %}\n  {% set tau = (t - event[0] - i*0.31) / event[2] %}\n  {% if tau >= 0\
                \ and tau < 9 %}\n    {% set coupling = 0.8 + 0.2*(sin(p+event[3]*1.7) ** 2) %}\n    {% set onset = [1.0,\
                \ tau / 0.35] | min %}\n    {% set smooth_onset = onset*onset*(3 - 2*onset) %}\n    {% set response.value\
                \ = response.value - event[1] * coupling * smooth_onset * (2.718281828 ** (-0.85*tau)) * sin(2.5*tau)\
                \ %}\n  {% endif %}\n{% endfor %}\n{{ [20, [100, ((baseline | float) + turbulence + wander + response.value)\
                \ | round | int] | min] | max }}"
          - variables:
              level: '{% set t = as_timestamp(now()) - (started | float) %}

                {% set previous = last_levels.get(repeat.item, 70) | float %}

                {% set dt = [0.0, t - (last_times.get(repeat.item, 0) | float)] | max %}

                {% set alpha = 1 - 2.718281828 ** (-dt / 1.3) %}

                {{ [20, [100, (previous + alpha*((raw_level | float)-previous)) | round | int] | min] | max }}'
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: '{{ repeat.item }}'
            data:
              brightness_pct: '{{ level | int }}'
          - variables:
              last_levels: '{{ dict(last_levels, **{repeat.item: level | float}) }}'
              last_times: '{{ dict(last_times, **{repeat.item: as_timestamp(now()) - (started | float)}) }}'
          - delay:
              milliseconds: '{{ [125, 150, 175, 200] | random }}'
- action: script.stop_natural_candlelight
- wait_template: '{{ is_state(''script.natural_candlelight'', ''off'') }}'
  timeout: 00:00:30
  continue_on_timeout: true
- if:
  - condition: state
    entity_id: script.natural_candlelight
    state: 'on'
  then:
  - action: script.turn_off
    target:
      entity_id: script.natural_candlelight
- action: script.turn_on
  target:
    entity_id: script.natural_candlelight
  data:
    variables:
      lights: []
      only_on: true
      minutes: 0
- if:
  - condition: template
    value_template: '{{ night_was_on }}'
  then:
  - action: automation.turn_on
    target:
      entity_id: automation.nightly_natural_candlelight
