alias: Lighting Manual Off Registry
description: Serialize persistent manual-off holds. Compact 8-character SHA256 tokens support 31 held bulbs.
  Overflow or a token collision holds all automatic lighting until explicitly cleared.
mode: queued
max: 50
max_exceeded: silent
fields:
  lights:
    name: Bulbs
    selector:
      entity:
        filter:
          domain: light
        multiple: true
  operation:
    name: Operation
    default: hold
    selector:
      select:
        options:
        - hold
        - release
        - clear_all
sequence:
- variables:
    ids: '{{ expand(lights|default([]))|selectattr(''domain'',''eq'',''light'')|map(attribute=''entity_id'')|list
      }}'
    stored: '{{ states(''input_text.lighting_manual_off'')|to_json }}'
    op: '{{ operation|default(''hold'') }}'
- variables:
    updated: '{% set ns=namespace(old=[],tokens=[],alltokens=[]) %}

      {% for i in range(0,stored|length,8) %}{% set ns.old=ns.old+[stored[i:i+8]] %}{% endfor %}

      {% for id in ids %}{% set ns.tokens=ns.tokens+[(id|sha256)[:8]] %}{% endfor %}

      {% for s in states.light %}{% set ns.alltokens=ns.alltokens+[(s.entity_id|sha256)[:8]] %}{% endfor %}

      {% set collision=ns.alltokens|count != ns.alltokens|unique|list|count %}

      {% if op==''clear_all'' %}{{ ''''|to_json }}

      {% elif stored in [''*'',''unknown'',''unavailable''] or stored|length % 8 != 0 or collision %}{{ ''*''|to_json
      }}

      {% else %}{% set result=(ns.old+ns.tokens)|unique|sort|list if op==''hold'' else ns.old|reject(''in'',ns.tokens)|list
      %}

      {{ (result|join('''') if result|count<=31 else ''*'')|to_json }}{% endif %}'
- action: input_text.set_value
  target:
    entity_id: input_text.lighting_manual_off
  data:
    value: '{{ updated|to_json }}'
