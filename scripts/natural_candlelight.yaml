alias: Natural Candlelight
description: Warm-white natural candlelight. From 9 PM to local sunrise, newly switched-on eligible bulbs fade from
  1% to 80% in 10 seconds before joining the flame effect. Optional alternating-week room eligibility.
icon: mdi:candle
mode: single
fields:
  lights:
    name: Bulbs
    description: Leave empty for every available dimmable light.
    required: false
    selector:
      entity:
        filter:
          domain: light
        multiple: true
  minutes:
    name: Minutes
    description: Zero runs until you press Stop Natural Candlelight.
    default: 0
    selector:
      number:
        min: 0
        max: 240
        step: 0.5
        mode: box
  only_on:
    name: Only lights already on
    description: Off lights stay off; lights turned on later join automatically.
    default: true
    selector:
      boolean: {}
variables:
  excluded_lights: []
  pause_helpers: []
  pause_automations: []
  alternating_week_lights: []
  alternating_week_start: '2026-01-02 16:00:00'
sequence:
- variables:
    requested: '{{ lights | default([], true) }}'
    run_minutes: '{{ [0, [240, minutes | default(0) | float(0)] | min] | max }}'
    seed: '{{ (range(0, 62832) | random) / 10000 }}'
    only_lit: '{{ only_on | default(true) | bool }}'
    preserve_start: '{{ preserve_brightness|default(false)|bool }}'
    automatic_fade_seconds: 10
    scheduled_run: '{{ scheduled_mode|default(false)|bool }}'
- variables:
    bulbs: "{% set held=states('input_text.lighting_manual_off') %}{% set held=held[2:] if held.startswith('h:')\
      \ else held %}{% set hold_valid=held not in ['*','unknown','unavailable'] and held|length % 8 == 0 %}{% set\
      \ present=true %}{% if alternating_week_lights|default([])|count>0 %}{% set anchor=strptime(alternating_week_start|default('2026-01-02\
      \ 16:00:00'),'%Y-%m-%d %H:%M:%S') %}{% set present=((now().replace(tzinfo=None)-anchor).days // 7) % 2 ==\
      \ 0 %}{% endif %}\n{% set out = namespace(ids=[]) %}\n{% set source = expand(requested) if requested | count\
      \ > 0 else states.light %}\n{% for s in source %}\n  {% set modes = s.attributes.get('supported_color_modes',\
      \ []) or [] %}\n  {% if s.domain == 'light' and s.state in ['on', 'off'] and s.entity_id not in excluded_lights\
      \ and hold_valid and (s.entity_id|sha256)[:8] not in held and (s.entity_id not in (alternating_week_lights|default([]))\
      \ or present)\n        and modes | reject('in', ['onoff', 'unknown']) | list | count > 0\n        and (not\
      \ only_lit or s.state == 'on') %}\n    {% set out.ids = out.ids + [s.entity_id] %}\n  {% endif %}\n{% endfor\
      \ %}\n{{ out.ids | unique | sort | list }}"
- wait_template: '{{ not is_state(''script.lighting_off_priority'',''on'') }}'
  timeout: 00:00:30
  continue_on_timeout: false
- variables:
    initial_fade_bulbs: '{{ fade_first_lights|default([])|select(''in'',bulbs)|list }}'
- if:
  - condition: template
    value_template: '{{ bulbs | count == 0 }}'
  then:
  - stop: No available dimmable bulbs were selected.
- if:
  - condition: template
    value_template: '{{ pause_helpers | count > 0 }}'
  then:
  - action: input_boolean.turn_off
    target:
      entity_id: '{{ pause_helpers }}'
- if:
  - condition: template
    value_template: '{{ pause_automations | count > 0 }}'
  then:
  - action: automation.turn_off
    target:
      entity_id: '{{ pause_automations }}'
    data:
      stop_actions: true
  - action: automation.turn_on
    target:
      entity_id: '{{ pause_automations }}'
- action: input_boolean.turn_on
  target:
    entity_id: input_boolean.natural_candlelight_active
- repeat:
    for_each: '{{ bulbs }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ not only_lit or is_state(repeat.item, ''on'') }}'
      - condition: template
        value_template: '{{ repeat.item not in initial_fade_bulbs }}'
      then:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: '{{ repeat.item }}'
        data: "{% set schedule_frame=states('input_text.lighting_schedule_frame')|from_json({}) if scheduled_run|default(false)\
          \ else {} %}{% set schedule_ceiling=schedule_frame.get('ceiling',80)|float %}{% set schedule_kelvin=schedule_frame.get('kelvin',2000)|int\
          \ %}{% set modes = state_attr(repeat.item, 'supported_color_modes') or [] %} {% if 'color_temp' in modes\
          \ %}\n  {% set low = state_attr(repeat.item, 'min_color_temp_kelvin') | int(2000) %}\n  {% set high =\
          \ state_attr(repeat.item, 'max_color_temp_kelvin') | int(6500) %}\n  {{ {'color_temp_kelvin': [low, [schedule_kelvin,\
          \ high] | min] | max} }}\n{% else %}\n  {{ {} }}\n{% endif %}"
- delay:
    milliseconds: 500
- repeat:
    for_each: '{{ bulbs }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ is_state(repeat.item, ''on'') }}'
      - condition: template
        value_template: '{{ not preserve_start }}'
      - condition: template
        value_template: '{{ repeat.item not in initial_fade_bulbs }}'
      then:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: '{{ repeat.item }}'
        data: '{% set schedule_frame=states(''input_text.lighting_schedule_frame'')|from_json({}) if scheduled_run|default(false)
          else {} %}{% set schedule_ceiling=schedule_frame.get(''ceiling'',80)|float %}{% set schedule_kelvin=schedule_frame.get(''kelvin'',2000)|int
          %}{% set selected=repeat.item %}{% set ids=[selected] if selected is string else selected %}{% set ns=namespace(ok=true,lo=2000,hi=6500)
          %}{% for id in ids %}{% if ''color_temp'' not in (state_attr(id,''supported_color_modes'') or []) %}{%
          set ns.ok=false %}{% endif %}{% set ns.lo=[ns.lo,state_attr(id,''min_color_temp_kelvin'')|int(2000)]|max
          %}{% set ns.hi=[ns.hi,state_attr(id,''max_color_temp_kelvin'')|int(6500)]|min %}{% endfor %}{% set cmd={''brightness_pct'':(([1,[schedule_ceiling,(50)*schedule_ceiling/80]|min]|max)|round(0)|int
          if scheduled_run|default(false) else (50))} %}{{ dict(cmd,color_temp_kelvin=[ns.lo,[schedule_kelvin,ns.hi]|min]|max)
          if ns.ok and ns.lo<=ns.hi else cmd }}'
- variables:
    started: '{{ as_timestamp(now()) }}'
    gust_events: []
    prepared_bulbs: '{{ bulbs }}'
    baseline_from: '{{ 80 if preserve_start else 50 }}'
    baseline_target: '{{ 80 if preserve_start else 50 }}'
    baseline_changed: 0
    baseline_next: '{{ (range(10,21) if preserve_start else range(45,151))|random }}'
    baseline_blend_seconds: 20
    last_levels: '{% if preserve_start %}{% set ns=namespace(items=[]) %}{% for id in bulbs %}{% set ns.items=ns.items+[(id,(handoff_levels|default({})).get(id,(state_attr(id,''brightness'')|float(204))*100/255))]
      %}{% endfor %}{{ dict(ns.items) }}{% else %}{{ {} }}{% endif %}'
    last_times: {}
    wind_next: '{{ range(8, 15) | random }}'
    leaving_low: false
    rebound_peak: 95
    flame_order: '{{ states.light | map(attribute=''entity_id'') | sort | list }}'
    prepared_versions: '{% set ns=namespace(items=[]) %}{% for s in expand(bulbs) if s.state==''on'' and s.entity_id
      not in initial_fade_bulbs %}{% set ns.items=ns.items+[(s.entity_id,as_timestamp(s.last_changed))] %}{% endfor
      %}{{ dict(ns.items) }}'
- repeat:
    while:
    - condition: template
      value_template: '{{ is_state(''input_boolean.natural_candlelight_active'', ''on'') and ((run_minutes | float)
        == 0 or as_timestamp(now()) - (started | float) < (run_minutes | float)*60) and expand(bulbs) | selectattr(''state'',
        ''eq'', ''on'') | list | count > 0 }}'
    - condition: template
      value_template: '{{ not scheduled_run or (is_state(''input_boolean.daily_lighting_schedule_active'',''on'')
        and (states(''input_text.lighting_schedule_frame'')|from_json({})).get(''ceiling'',0)|float>0) }}'
    sequence:
    - variables:
        bulbs: "{% set held=states('input_text.lighting_manual_off') %}{% set held=held[2:] if held.startswith('h:')\
          \ else held %}{% set hold_valid=held not in ['*','unknown','unavailable'] and held|length % 8 == 0 %}{%\
          \ set present=true %}{% if alternating_week_lights|default([])|count>0 %}{% set anchor=strptime(alternating_week_start|default('2026-01-02\
          \ 16:00:00'),'%Y-%m-%d %H:%M:%S') %}{% set present=((now().replace(tzinfo=None)-anchor).days // 7) % 2\
          \ == 0 %}{% endif %}\n{% set out = namespace(ids=[]) %}\n{% set source = expand(requested) if requested\
          \ | count > 0 else states.light %}\n{% for s in source %}\n  {% set modes = s.attributes.get('supported_color_modes',\
          \ []) or [] %}\n  {% if s.domain == 'light' and s.state in ['on', 'off'] and s.entity_id not in excluded_lights\
          \ and hold_valid and (s.entity_id|sha256)[:8] not in held and (s.entity_id not in (alternating_week_lights|default([]))\
          \ or present)\n        and modes | reject('in', ['onoff', 'unknown']) | list | count > 0\n        and\
          \ (not only_lit or s.state == 'on') %}\n    {% set out.ids = out.ids + [s.entity_id] %}\n  {% endif %}\n\
          {% endfor %}\n{{ out.ids | unique | sort | list }}"
        flame_order: '{{ states.light | map(attribute=''entity_id'') | sort | list }}'
    - variables:
        prepared_bulbs: '{{ prepared_bulbs | select(''in'', bulbs) | select(''is_state'', ''on'') | list }}'
    - variables:
        new_bulbs: '{% set ns=namespace(ids=[]) %}{% for s in expand(bulbs) if s.state==''on'' %}{% if prepared_versions.get(s.entity_id)
          != as_timestamp(s.last_changed) %}{% set ns.ids=ns.ids+[s.entity_id] %}{% endif %}{% endfor %}{{ ns.ids
          }}'
    - if:
      - condition: template
        value_template: '{{ automatic_fade|default(true)|bool and is_state(''automation.nightly_natural_candlelight'',''on'')
          and (now().hour >= 21 or (now().hour < 12 and is_state(''sun.sun'',''below_horizon''))) }}'
      - condition: template
        value_template: '{{ new_bulbs|count > 0 }}'
      then:
      - delay:
          milliseconds: 250
      - variables:
          bulbs: "{% set held=states('input_text.lighting_manual_off') %}{% set held=held[2:] if held.startswith('h:')\
            \ else held %}{% set hold_valid=held not in ['*','unknown','unavailable'] and held|length % 8 == 0 %}{%\
            \ set present=true %}{% if alternating_week_lights|default([])|count>0 %}{% set anchor=strptime(alternating_week_start|default('2026-01-02\
            \ 16:00:00'),'%Y-%m-%d %H:%M:%S') %}{% set present=((now().replace(tzinfo=None)-anchor).days // 7) %\
            \ 2 == 0 %}{% endif %}\n{% set out = namespace(ids=[]) %}\n{% set source = expand(requested) if requested\
            \ | count > 0 else states.light %}\n{% for s in source %}\n  {% set modes = s.attributes.get('supported_color_modes',\
            \ []) or [] %}\n  {% if s.domain == 'light' and s.state in ['on', 'off'] and s.entity_id not in excluded_lights\
            \ and hold_valid and (s.entity_id|sha256)[:8] not in held and (s.entity_id not in (alternating_week_lights|default([]))\
            \ or present)\n        and modes | reject('in', ['onoff', 'unknown']) | list | count > 0\n        and\
            \ (not only_lit or s.state == 'on') %}\n    {% set out.ids = out.ids + [s.entity_id] %}\n  {% endif\
            \ %}\n{% endfor %}\n{{ out.ids | unique | sort | list }}"
      - variables:
          fade_bulbs: '{% set ns=namespace(ids=[]) %}{% for s in expand(bulbs) if s.state==''on'' %}{% if prepared_versions.get(s.entity_id)
            != as_timestamp(s.last_changed) %}{% set ns.ids=ns.ids+[s.entity_id] %}{% endif %}{% endfor %}{{ ns.ids
            }}'
      - repeat:
          for_each: '{{ fade_bulbs }}'
          sequence:
          - if:
            - condition: template
              value_template: '{{ is_state(repeat.item,''on'') and is_state(''input_boolean.natural_candlelight_active'',''on'')
                and ((run_minutes|float)==0 or as_timestamp(now())-(started|float)<(run_minutes|float)*60) }}'
            then:
            - action: light.turn_on
              continue_on_error: true
              target:
                entity_id: '{{ repeat.item }}'
              data: '{% set schedule_frame=states(''input_text.lighting_schedule_frame'')|from_json({}) if scheduled_run|default(false)
                else {} %}{% set schedule_ceiling=schedule_frame.get(''ceiling'',80)|float %}{% set schedule_kelvin=schedule_frame.get(''kelvin'',2000)|int
                %}{% set modes=state_attr(repeat.item,''supported_color_modes'') or [] %}{% set lo=state_attr(repeat.item,''min_color_temp_kelvin'')|int(2000)
                %}{% set hi=state_attr(repeat.item,''max_color_temp_kelvin'')|int(6500) %}{{ {''brightness'':3,''color_temp_kelvin'':[lo,[2000,hi]|min]|max}
                if ''color_temp'' in modes else {''brightness'':3} }}'
      - variables:
          fade_started: '{{ as_timestamp(now()) }}'
          previous_level: 3
      - repeat:
          while:
          - condition: template
            value_template: '{{ is_state(''input_boolean.natural_candlelight_active'',''on'') and fade_bulbs|select(''is_state'',''on'')|list|count
              > 0 and ((run_minutes|float)==0 or as_timestamp(now())-(started|float)<(run_minutes|float)*60) }}'
          - condition: template
            value_template: '{{ as_timestamp(now())-(fade_started|float) < (automatic_fade_seconds|float) }}'
          sequence:
          - variables:
              fade_level: '{% set u=[0,[1,(as_timestamp(now())-(fade_started|float))/(automatic_fade_seconds|float)]|min]|max
                %}{{ (3+201*u*u*(3-2*u))|round(0)|int }}'
          - if:
            - condition: template
              value_template: '{{ (fade_level|int) > (previous_level|int) }}'
            - condition: template
              value_template: '{{ is_state(''input_boolean.natural_candlelight_active'',''on'') and fade_bulbs|select(''is_state'',''on'')|list|count
                > 0 and ((run_minutes|float)==0 or as_timestamp(now())-(started|float)<(run_minutes|float)*60) }}'
            then:
            - action: light.turn_on
              continue_on_error: true
              target:
                entity_id: '{{ fade_bulbs|select(''is_state'',''on'')|list }}'
              data: '{% set schedule_frame=states(''input_text.lighting_schedule_frame'')|from_json({}) if scheduled_run|default(false)
                else {} %}{% set schedule_ceiling=schedule_frame.get(''ceiling'',80)|float %}{% set schedule_kelvin=schedule_frame.get(''kelvin'',2000)|int
                %}{% set selected=fade_bulbs|select(''is_state'',''on'')|list %}{% set ids=[selected] if selected
                is string else selected %}{% set ns=namespace(ok=true,lo=2000,hi=6500) %}{% for id in ids %}{% if
                ''color_temp'' not in (state_attr(id,''supported_color_modes'') or []) %}{% set ns.ok=false %}{%
                endif %}{% set ns.lo=[ns.lo,state_attr(id,''min_color_temp_kelvin'')|int(2000)]|max %}{% set ns.hi=[ns.hi,state_attr(id,''max_color_temp_kelvin'')|int(6500)]|min
                %}{% endfor %}{% set cmd={''brightness'':(fade_level|int)} %}{{ dict(cmd,color_temp_kelvin=[ns.lo,[schedule_kelvin,ns.hi]|min]|max)
                if ns.ok and ns.lo<=ns.hi else cmd }}'
          - variables:
              previous_level: '{{ fade_level|int }}'
          - delay:
              milliseconds: 150
      - if:
        - condition: template
          value_template: '{{ is_state(''input_boolean.natural_candlelight_active'',''on'') and fade_bulbs|select(''is_state'',''on'')|list|count
            > 0 and ((run_minutes|float)==0 or as_timestamp(now())-(started|float)<(run_minutes|float)*60) }}'
        then:
        - action: light.turn_on
          continue_on_error: true
          target:
            entity_id: '{{ fade_bulbs|select(''is_state'',''on'')|list }}'
          data: '{% set schedule_frame=states(''input_text.lighting_schedule_frame'')|from_json({}) if scheduled_run|default(false)
            else {} %}{% set schedule_ceiling=schedule_frame.get(''ceiling'',80)|float %}{% set schedule_kelvin=schedule_frame.get(''kelvin'',2000)|int
            %}{% set selected=fade_bulbs|select(''is_state'',''on'')|list %}{% set ids=[selected] if selected is
            string else selected %}{% set ns=namespace(ok=true,lo=2000,hi=6500) %}{% for id in ids %}{% if ''color_temp''
            not in (state_attr(id,''supported_color_modes'') or []) %}{% set ns.ok=false %}{% endif %}{% set ns.lo=[ns.lo,state_attr(id,''min_color_temp_kelvin'')|int(2000)]|max
            %}{% set ns.hi=[ns.hi,state_attr(id,''max_color_temp_kelvin'')|int(6500)]|min %}{% endfor %}{% set cmd={''brightness'':(204)}
            %}{{ dict(cmd,color_temp_kelvin=[ns.lo,[schedule_kelvin,ns.hi]|min]|max) if ns.ok and ns.lo<=ns.hi else
            cmd }}'
      - variables:
          last_levels: '{% set ns=namespace(items=[]) %}{% for id in fade_bulbs if is_state(id,''on'') %}{% set
            ns.items=ns.items+[(id,80)] %}{% endfor %}{{ dict(last_levels,**dict(ns.items)) }}'
          last_times: '{% set ns=namespace(items=[]) %}{% for id in fade_bulbs if is_state(id,''on'') %}{% set ns.items=ns.items+[(id,as_timestamp(now())-(started|float))]
            %}{% endfor %}{{ dict(last_times,**dict(ns.items)) }}'
          prepared_bulbs: '{{ (prepared_bulbs+fade_bulbs)|unique|list }}'
    - variables:
        prepared_versions: '{% set ns=namespace(items=[]) %}{% for s in expand(bulbs) if s.state==''on'' %}{% set
          ns.items=ns.items+[(s.entity_id,as_timestamp(s.last_changed))] %}{% endfor %}{{ dict(ns.items) }}'
    - variables:
        elapsed: '{{ as_timestamp(now()) - (started | float) }}'
    - if:
      - condition: template
        value_template: '{{ (elapsed | float) >= (baseline_next | float) }}'
      then:
      - variables:
          leaving_low: '{{ (baseline_target | float) <= 50 }}'
          baseline_from: '{{ baseline_target }}'
          baseline_target: '{{ ([70, 70, 70, 80] if leaving_low else ([50, 50, 70] if (baseline_from | int) == 80
            else [50, 50, 50, 80])) | random }}'
          baseline_changed: '{{ elapsed }}'
          baseline_blend_seconds: '{{ (range(2, 5) if leaving_low else range(10, 21)) | random }}'
          baseline_next: '{{ (elapsed | float) + (baseline_blend_seconds | float) + ((range(10, 21) if (baseline_target
            | int) == 80 else (range(30, 76) if (baseline_target | int) == 70 else range(45, 151))) | random) }}'
          rebound_peak: '{{ range(90, 101) | random }}'
      - if:
        - condition: template
          value_template: '{{ leaving_low }}'
        then:
        - repeat:
            for_each: '{% set ns=namespace(total=0.0, count=0) %}

              {% for id in bulbs %}{% if id in last_levels %}{% set ns.total=ns.total+(last_levels[id] | float)
              %}{% set ns.count=ns.count+1 %}{% endif %}{% endfor %}

              {% set current = ns.total/ns.count if ns.count > 0 else 50 %}

              {{ [(current + (rebound_peak | float))/2, rebound_peak | float] }}'
            sequence:
            - if:
              - condition: template
                value_template: '{{ is_state(''input_boolean.natural_candlelight_active'', ''on'') and ((run_minutes
                  | float) == 0 or as_timestamp(now()) - (started | float) < (run_minutes | float)*60) and expand(bulbs)
                  | selectattr(''state'', ''eq'', ''on'') | list | count > 0 }}'
              then:
              - action: light.turn_on
                continue_on_error: true
                target:
                  entity_id: '{{ expand(bulbs) | selectattr(''state'', ''eq'', ''on'') | map(attribute=''entity_id'')
                    | list }}'
                data: '{% set schedule_frame=states(''input_text.lighting_schedule_frame'')|from_json({}) if scheduled_run|default(false)
                  else {} %}{% set schedule_ceiling=schedule_frame.get(''ceiling'',80)|float %}{% set schedule_kelvin=schedule_frame.get(''kelvin'',2000)|int
                  %}{% set selected=expand(bulbs) | selectattr(''state'', ''eq'', ''on'') | map(attribute=''entity_id'')
                  | list %}{% set ids=[selected] if selected is string else selected %}{% set ns=namespace(ok=true,lo=2000,hi=6500)
                  %}{% for id in ids %}{% if ''color_temp'' not in (state_attr(id,''supported_color_modes'') or
                  []) %}{% set ns.ok=false %}{% endif %}{% set ns.lo=[ns.lo,state_attr(id,''min_color_temp_kelvin'')|int(2000)]|max
                  %}{% set ns.hi=[ns.hi,state_attr(id,''max_color_temp_kelvin'')|int(6500)]|min %}{% endfor %}{%
                  set cmd={''brightness_pct'':(([1,[schedule_ceiling,(repeat.item | round | int)*schedule_ceiling/80]|min]|max)|round(0)|int
                  if scheduled_run|default(false) else (repeat.item | round | int))} %}{{ dict(cmd,color_temp_kelvin=[ns.lo,[schedule_kelvin,ns.hi]|min]|max)
                  if ns.ok and ns.lo<=ns.hi else cmd }}'
              - delay:
                  milliseconds: '{{ [120, 150, 180] | random }}'
        - delay:
            milliseconds: '{{ [250, 350, 450] | random }}'
        - variables:
            baseline_from: '{{ rebound_peak }}'
            baseline_changed: '{{ as_timestamp(now()) - (started | float) }}'
            baseline_next: '{{ (baseline_next | float) + as_timestamp(now()) - (started | float) - (elapsed | float)
              }}'
            wind_next: '{{ [wind_next | float, as_timestamp(now()) - (started | float) + (range(15, 26) | random)]
              | max }}'
            gust_events: []
            last_levels: '{% set ns=namespace(items=[]) %}{% for id in bulbs %}{% set ns.items=ns.items+[(id, rebound_peak
              | float)] %}{% endfor %}{{ dict(ns.items) }}'
            last_times: '{% set ns=namespace(items=[]) %}{% for id in bulbs %}{% set ns.items=ns.items+[(id, as_timestamp(now())
              - (started | float))] %}{% endfor %}{{ dict(ns.items) }}'
    - if:
      - condition: template
        value_template: '{{ (elapsed | float) >= (wind_next | float) }}'
      then:
      - variables:
          burst_baseline: '{% set age = as_timestamp(now()) - (started | float) - (baseline_changed | float) %}

            {% set u = [0.0, [1.0, age / (baseline_blend_seconds | float)] | min] | max %}

            {% set blend = u*u*(3 - 2*u) %}

            {{ (baseline_from | float) + ((baseline_target | float) - (baseline_from | float))*blend }}'
          pulse_count: '{{ [1, 3] | random }}'
      - variables:
          burst_level: '{{ burst_baseline }}'
      - repeat:
          count: '{{ pulse_count }}'
          sequence:
          - variables:
              dip_level: '{% set fraction = (range(20, 41) | random) if (pulse_count | int) == 1 else (range(25,
                61) | random) %}

                {{ [20, (burst_baseline | float) * fraction / 100] | max }}'
              recovery_level: "{% if (pulse_count | int) == 1 %}\n  {% set lift = range(-3, 5) | random %}\n{% elif\
                \ (range(0, 5) | random) == 0 %}\n  {% set lift = range(10, 31) | random %}\n{% else %}\n  {% set\
                \ lift = range(-4, 11) | random %}\n{% endif %}\n{{ [20, [100, (burst_baseline | float) + lift]\
                \ | min] | max }}"
          - repeat:
              for_each: '{% set a = burst_level | float %}{% set d = dip_level | float %}{% set r = recovery_level
                | float %}

                {{ [a+(d-a)/3, a+2*(d-a)/3, d, d+(r-d)/3, d+2*(r-d)/3, r] }}'
              sequence:
              - if:
                - condition: template
                  value_template: '{{ is_state(''input_boolean.natural_candlelight_active'', ''on'') and ((run_minutes
                    | float) == 0 or as_timestamp(now()) - (started | float) < (run_minutes | float)*60) and expand(bulbs)
                    | selectattr(''state'', ''eq'', ''on'') | list | count > 0 }}'
                then:
                - action: light.turn_on
                  continue_on_error: true
                  target:
                    entity_id: '{{ expand(bulbs) | selectattr(''state'', ''eq'', ''on'') | map(attribute=''entity_id'')
                      | list }}'
                  data: '{% set schedule_frame=states(''input_text.lighting_schedule_frame'')|from_json({}) if scheduled_run|default(false)
                    else {} %}{% set schedule_ceiling=schedule_frame.get(''ceiling'',80)|float %}{% set schedule_kelvin=schedule_frame.get(''kelvin'',2000)|int
                    %}{% set selected=expand(bulbs) | selectattr(''state'', ''eq'', ''on'') | map(attribute=''entity_id'')
                    | list %}{% set ids=[selected] if selected is string else selected %}{% set ns=namespace(ok=true,lo=2000,hi=6500)
                    %}{% for id in ids %}{% if ''color_temp'' not in (state_attr(id,''supported_color_modes'') or
                    []) %}{% set ns.ok=false %}{% endif %}{% set ns.lo=[ns.lo,state_attr(id,''min_color_temp_kelvin'')|int(2000)]|max
                    %}{% set ns.hi=[ns.hi,state_attr(id,''max_color_temp_kelvin'')|int(6500)]|min %}{% endfor %}{%
                    set cmd={''brightness_pct'':(([1,[schedule_ceiling,(repeat.item | round | int)*schedule_ceiling/80]|min]|max)|round(0)|int
                    if scheduled_run|default(false) else (repeat.item | round | int))} %}{{ dict(cmd,color_temp_kelvin=[ns.lo,[schedule_kelvin,ns.hi]|min]|max)
                    if ns.ok and ns.lo<=ns.hi else cmd }}'
                - delay:
                    milliseconds: '{{ ([130, 150, 175] if (pulse_count | int) == 1 else [150, 175, 200]) | random
                      }}'
          - variables:
              burst_level: '{{ recovery_level }}'
          - delay:
              milliseconds: '{{ [200, 300, 450, 650] | random }}'
      - variables:
          wind_next: '{{ as_timestamp(now()) - (started | float) + (range(40, 101) | random) }}'
          gust_events: '{% if (pulse_count | int) == 1 %}{{ [] }}{% else %}{{ [[as_timestamp(now()) - (started |
            float), range(30, 51) | random, (range(20, 31) | random)/10, range(0,10000) | random]] }}{% endif %}'
          last_levels: '{% set ns=namespace(items=[]) %}{% for id in bulbs %}{% set ns.items=ns.items+[(id, burst_level
            | float)] %}{% endfor %}{{ dict(ns.items) }}'
          last_times: '{% set ns=namespace(items=[]) %}{% for id in bulbs %}{% set ns.items=ns.items+[(id, as_timestamp(now())
            - (started | float))] %}{% endfor %}{{ dict(ns.items) }}'
    - repeat:
        for_each: '{{ bulbs }}'
        sequence:
        - if:
          - condition: template
            value_template: '{{ is_state(''input_boolean.natural_candlelight_active'', ''on'') and ((run_minutes
              | float) == 0 or as_timestamp(now()) - (started | float) < (run_minutes | float)*60) and is_state(repeat.item,
              ''on'') }}'
          then:
          - if:
            - condition: template
              value_template: '{{ repeat.item not in prepared_bulbs }}'
            then:
            - action: light.turn_on
              continue_on_error: true
              target:
                entity_id: '{{ repeat.item }}'
              data: "{% set schedule_frame=states('input_text.lighting_schedule_frame')|from_json({}) if scheduled_run|default(false)\
                \ else {} %}{% set schedule_ceiling=schedule_frame.get('ceiling',80)|float %}{% set schedule_kelvin=schedule_frame.get('kelvin',2000)|int\
                \ %}{% set modes = state_attr(repeat.item, 'supported_color_modes') or [] %} {% if 'color_temp'\
                \ in modes %}\n  {% set low = state_attr(repeat.item, 'min_color_temp_kelvin') | int(2000) %}\n\
                \  {% set high = state_attr(repeat.item, 'max_color_temp_kelvin') | int(6500) %}\n  {{ {'color_temp_kelvin':\
                \ [low, [schedule_kelvin, high] | min] | max} }}\n{% else %}\n  {{ {} }}\n{% endif %}"
            - delay:
                milliseconds: 500
            - variables:
                prepared_bulbs: '{{ prepared_bulbs + [repeat.item] }}'
    - repeat:
        for_each: '{{ range(0, 3) | list }}'
        sequence:
        - variables:
            cohort: "{% set ns=namespace(ids=[]) %}\n{% for id in bulbs %}\n  {% if id in flame_order and (flame_order.index(id)\
              \ % 3) == (repeat.item | int) and is_state(id, 'on') %}\n    {% set ns.ids=ns.ids+[id] %}\n  {% endif\
              \ %}\n{% endfor %}\n{{ ns.ids }}"
        - if:
          - condition: template
            value_template: '{{ is_state(''input_boolean.natural_candlelight_active'', ''on'') and ((run_minutes
              | float) == 0 or as_timestamp(now()) - (started | float) < (run_minutes | float)*60) and cohort |
              select(''is_state'', ''on'') | list | count > 0 }}'
          then:
          - variables:
              flame_id: '{{ cohort[0] }}'
          - variables:
              baseline: '{% set age = as_timestamp(now()) - (started | float) - (baseline_changed | float) %}

                {% set u = [0.0, [1.0, age / (baseline_blend_seconds | float)] | min] | max %}

                {% set blend = u*u*(3 - 2*u) %}

                {{ (baseline_from | float) + ((baseline_target | float) - (baseline_from | float))*blend }}'
          - variables:
              raw_level: "{% set t = as_timestamp(now()) - (started | float) %} {% set all_ids = states.light |\
                \ map(attribute='entity_id') | sort | list %}\n{% set i = all_ids.index(flame_id) %} {% set p =\
                \ (seed | float) + i * 2.39996 %} {% set envelope = 0.65 + 0.35 * (sin(0.17*t + (seed | float))\
                \ ** 2) %} {% set turbulence = envelope * (4.5*sin(1.1*t+p) + 3.2*sin(2.17*t+1.9*p) + 2.2*sin(3.71*t+0.7*p)\
                \ + 1.4*sin(5.3*t+2.4*p)) %} {% set wander = 4*sin(0.075*t+p) + 2*sin(0.19*t+1.7*p) %} {% set response\
                \ = namespace(value=0.0) %} {% for event in gust_events %}\n  {% set tau = (t - event[0] - i*0.31)\
                \ / event[2] %}\n  {% if tau >= 0 and tau < 9 %}\n    {% set coupling = 0.8 + 0.2*(sin(p+event[3]*1.7)\
                \ ** 2) %}\n    {% set onset = [1.0, tau / 0.35] | min %}\n    {% set smooth_onset = onset*onset*(3\
                \ - 2*onset) %}\n    {% set response.value = response.value - event[1] * coupling * smooth_onset\
                \ * (2.718281828 ** (-0.85*tau)) * sin(2.5*tau) %}\n  {% endif %}\n{% endfor %}\n{{ [20, [100, ((baseline\
                \ | float) + turbulence + wander + response.value) | round | int] | min] | max }}"
          - variables:
              level: '{% set t = as_timestamp(now()) - (started | float) %}

                {% set previous = last_levels.get(flame_id, 50) | float %}

                {% set dt = [0.0, t - (last_times.get(flame_id, 0) | float)] | max %}

                {% set alpha = 1 - 2.718281828 ** (-dt / 1.0) %}

                {{ [20, [100, (previous + alpha*((raw_level | float)-previous)) | round | int] | min] | max }}'
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: '{{ cohort | select(''is_state'', ''on'') | list }}'
            data: '{% set schedule_frame=states(''input_text.lighting_schedule_frame'')|from_json({}) if scheduled_run|default(false)
              else {} %}{% set schedule_ceiling=schedule_frame.get(''ceiling'',80)|float %}{% set schedule_kelvin=schedule_frame.get(''kelvin'',2000)|int
              %}{% set selected=cohort | select(''is_state'', ''on'') | list %}{% set ids=[selected] if selected
              is string else selected %}{% set ns=namespace(ok=true,lo=2000,hi=6500) %}{% for id in ids %}{% if
              ''color_temp'' not in (state_attr(id,''supported_color_modes'') or []) %}{% set ns.ok=false %}{% endif
              %}{% set ns.lo=[ns.lo,state_attr(id,''min_color_temp_kelvin'')|int(2000)]|max %}{% set ns.hi=[ns.hi,state_attr(id,''max_color_temp_kelvin'')|int(6500)]|min
              %}{% endfor %}{% set cmd={''brightness_pct'':(([1,[schedule_ceiling,(level | int)*schedule_ceiling/80]|min]|max)|round(0)|int
              if scheduled_run|default(false) else (level | int))} %}{{ dict(cmd,color_temp_kelvin=[ns.lo,[schedule_kelvin,ns.hi]|min]|max)
              if ns.ok and ns.lo<=ns.hi else cmd }}'
          - variables:
              last_levels: '{% set ns=namespace(items=[]) %}{% for id in cohort %}{% set ns.items=ns.items+[(id,
                level | float)] %}{% endfor %}{{ dict(last_levels, **dict(ns.items)) }}'
              last_times: '{% set ns=namespace(items=[]) %}{% for id in cohort %}{% set ns.items=ns.items+[(id,
                as_timestamp(now()) - (started | float))] %}{% endfor %}{{ dict(last_times, **dict(ns.items)) }}'
          - delay:
              milliseconds: '{{ [500, (cohort | count) * 100] | max }}'
- repeat:
    for_each: '{{ bulbs }}'
    sequence:
    - if:
      - condition: template
        value_template: '{{ is_state(repeat.item, ''on'') }}'
      - condition: template
        value_template: '{{ not scheduled_run }}'
      then:
      - action: light.turn_on
        continue_on_error: true
        target:
          entity_id: '{{ repeat.item }}'
        data: '{% set schedule_frame=states(''input_text.lighting_schedule_frame'')|from_json({}) if scheduled_run|default(false)
          else {} %}{% set schedule_ceiling=schedule_frame.get(''ceiling'',80)|float %}{% set schedule_kelvin=schedule_frame.get(''kelvin'',2000)|int
          %}{% set selected=repeat.item %}{% set ids=[selected] if selected is string else selected %}{% set ns=namespace(ok=true,lo=2000,hi=6500)
          %}{% for id in ids %}{% if ''color_temp'' not in (state_attr(id,''supported_color_modes'') or []) %}{%
          set ns.ok=false %}{% endif %}{% set ns.lo=[ns.lo,state_attr(id,''min_color_temp_kelvin'')|int(2000)]|max
          %}{% set ns.hi=[ns.hi,state_attr(id,''max_color_temp_kelvin'')|int(6500)]|min %}{% endfor %}{% set cmd={''brightness_pct'':(([1,[schedule_ceiling,(80)*schedule_ceiling/80]|min]|max)|round(0)|int
          if scheduled_run|default(false) else (80))} %}{{ dict(cmd,color_temp_kelvin=[ns.lo,[schedule_kelvin,ns.hi]|min]|max)
          if ns.ok and ns.lo<=ns.hi else cmd }}'
- action: input_boolean.turn_off
  target:
    entity_id: input_boolean.natural_candlelight_active
