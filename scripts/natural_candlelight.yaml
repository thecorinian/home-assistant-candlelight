natural_candlelight:
  alias: Natural Candlelight
  description: Warm white candle flicker for selected bulbs. Runs until stopped or the requested duration ends.
  icon: mdi:candle
  mode: restart
  fields:
    lights:
      name: Bulbs
      required: false
      selector:
        entity:
          filter:
            domain: light
          multiple: true
    minutes:
      name: Minutes
      default: 0
      selector:
        number:
          min: 0
          max: 240
          step: 0.5
          mode: box
  sequence:
  - variables:
      bulbs: '{{ lights | default([''light.keith_s_room_1'',''light.keith_s_room_2''], true) }}'
      run_minutes: '{{ minutes | default(0) | float(0) }}'
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.natural_candlelight_active
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.daily_lighting_schedule_active
  - action: light.turn_on
    target:
      entity_id: '{{ bulbs }}'
    data:
      brightness_pct: 80
      color_temp_kelvin: 2000
    continue_on_error: true
  - variables:
      started: '{{ as_timestamp(now()) }}'
  - repeat:
      while:
      - condition: state
        entity_id: input_boolean.natural_candlelight_active
        state: 'on'
      - condition: template
        value_template: '{{ (run_minutes == 0) or (as_timestamp(now()) - (started | float) < run_minutes * 60) }}'
      sequence:
      - repeat:
          for_each: '{{ bulbs }}'
          sequence:
          - action: light.turn_on
            continue_on_error: true
            target:
              entity_id: '{{ repeat.item }}'
            data:
              brightness_pct: '{{ range(62,101) | random }}'
              color_temp_kelvin: 2000
              transition: 2
      - delay:
          seconds: '{{ range(2,6) | random }}'
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.natural_candlelight_active
